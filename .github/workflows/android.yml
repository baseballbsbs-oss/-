name: Android CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# 같은 브랜치에 새 푸시가 오면 이전 실행은 취소합니다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: 단위 테스트 · 디버그 APK 빌드
    runs-on: ubuntu-latest

    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4

      - name: JDK 17 설치
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 러너에 Android SDK 가 이미 있지만, 라이선스 동의와 필요한 패키지를
      # 확실히 맞추기 위해 명시적으로 준비합니다.
      - name: Android SDK 준비
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Gradle 준비 (의존성 캐시 포함)
        uses: gradle/actions/setup-gradle@v4

      - name: 단위 테스트
        run: ./gradlew --no-daemon test

      - name: 디버그 APK 빌드
        run: ./gradlew --no-daemon assembleDebug

      - name: 테스트 리포트 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 14

      # 갤럭시 폰에 바로 설치해 볼 수 있도록 APK 를 첨부합니다.
      - name: 디버그 APK 업로드
        uses: actions/upload-artifact@v4
        with:
          name: panic-tracker-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
