<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0f172a" />
  <title>파트별 업무 공유 스케줄러</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- 상단 바 -->
  <header class="topbar">
    <div class="topbar-row">
      <h1 class="brand">📋 업무 스케줄러</h1>
      <button id="whoami" class="who-btn" title="사용자 선택">👤 <span id="whoami-name">미지정</span></button>
    </div>
    <div class="topbar-row">
      <select id="project-select" class="project-select"></select>
      <button id="report-btn" class="icon-btn" title="일별 작업사항 정리">📅</button>
      <button id="add-project" class="icon-btn" title="프로젝트 추가">＋</button>
      <button id="del-project" class="icon-btn danger" title="프로젝트 삭제">🗑</button>
    </div>
  </header>

  <!-- 메뉴 목록 화면 -->
  <main id="view-menus" class="view">
    <div id="menu-list" class="menu-list"></div>
    <button id="add-menu" class="fab">＋ 업무 메뉴 추가</button>
  </main>

  <!-- 작업오더 일별 작업사항 (스와이프) 화면 -->
  <section id="view-swipe" class="view hidden">
    <div class="swipe-header">
      <button id="swipe-back" class="icon-btn">←</button>
      <div class="swipe-title">
        <div id="swipe-menu-name" class="swipe-menu-name"></div>
        <div id="swipe-counter" class="swipe-counter"></div>
      </div>
      <button id="swipe-edit" class="icon-btn" title="작업오더 정보 수정">✎</button>
    </div>
    <div id="swipe-track" class="swipe-track"></div>
    <div class="swipe-dots" id="swipe-dots"></div>
  </section>

  <!-- 일별 작업사항 정리 (표) 화면 -->
  <section id="view-report" class="view hidden">
    <div class="swipe-header">
      <button id="report-back" class="icon-btn">←</button>
      <div class="swipe-title">
        <div class="swipe-menu-name">📅 일별 작업사항 정리</div>
        <div id="report-sub" class="swipe-counter"></div>
      </div>
      <button id="report-export" class="icon-btn" title="엑셀 내보내기">⬇</button>
    </div>
    <div id="report-body" class="report-body"></div>
  </section>

  <!-- 모달 -->
  <div id="modal-backdrop" class="modal-backdrop hidden">
    <div class="modal" id="modal"></div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <!-- 로그인 게이트 -->
  <div id="login-gate" class="login-gate hidden">
    <div class="login-box">
      <div class="login-emoji">🔒</div>
      <h2>파트별 업무 스케줄러</h2>
      <p>파트원 공용 비밀번호를 입력하세요.</p>
      <input id="login-pw" type="password" placeholder="비밀번호" autocomplete="current-password" />
      <button id="login-btn" class="btn btn-primary">입장</button>
      <div id="login-err" class="login-err"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
